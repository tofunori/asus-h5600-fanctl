name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -oP 'Version \K[0-9.]+' fanctl-gui.py | head -1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Check if tag exists
        id: check_tag
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/v${{ steps.version.outputs.version }}"; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: |
            ## ASUS Fan Control v${{ steps.version.outputs.version }}

            ### Installation
            ```bash
            git clone https://github.com/tofunori/asus-h5600-fanctl.git
            cd asus-h5600-fanctl
            ./install.sh
            ```

            See [README](https://github.com/tofunori/asus-h5600-fanctl#readme) for full documentation.
          files: |
            fanctl-gui.py
            fanctl.sh
            install.sh
          generate_release_notes: true
